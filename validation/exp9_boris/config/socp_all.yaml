# Exp9 social preference, all six batches, S1 and S2.
#
# HAB runs from socp_hab_all.yaml (same detector, S1 side file).
#
# metadata_dir is deliberately NOT set. DLCA_SocP falls back to the per-phase
# input directory when it is absent, which is what makes the per-batch
# novelLocS1/S2.txt files resolve correctly; setting it would force one
# batch's novel-side table onto all six.
#
# The chamber aspect ratio is 1.826-1.831 in every batch against 44/24 =
# 1.833 expected, so 44 x 24 cm applies throughout.

input_dir: C:/Users/topohl/Documents/exp9_sleap_staging/SocP
output_dir: C:/Users/topohl/iCloudDrive/Dokumente/Analysis/Behavior/correlate_sleap_boris/sleap_output_all/SocP
animal_id_code_file: C:/Users/topohl/Documents/exp9_sleap_staging/animalIDCode.txt
novel_location_file_prefix: novelLoc
phases: [S1, S2]
batches: [B1, B2, B3, B4, B5, B6]

fps: 30

arena_width_cm: 44
arena_height_cm: 24
arena_corner_names: [tl, tr, br, bl]

max_interpolation_gap_s: 0.2
likelihood_cutoff: ~
max_plausible_speed_cm_s: 100

qc_min_valid_fraction: 0.8
qc_max_longest_gap_s: 5.0
qc_max_interpolated_fraction: 0.2

movement_cutoff_cm_s: 5
integration_period_frames: 5

contact_distance_cm: 6
body_exclusion_distance_cm: 1
proximity_range_cm: [6, 10]
require_orientation: false

# Time on top of a cup is not contact (manual scoring does not count it).
# A floor-level body centre stays at least ~5 cm from the cup point and never
# between the cup and the corner; on the lid the mouse is imaged ~1.15-1.25x
# larger. Set on all 348 SocP recordings and checked by blind review of 123
# frames (2026-11-05): see docs/assay_definitions.md.
on_cup_exclusion: true
on_cup_footprint_radius_cm: 4
on_cup_beyond_cm: 2
on_cup_max_distance_cm: 10
on_cup_min_apparent_size: 1.08
on_cup_merge_gap_s: 0.5
on_cup_min_episode_s: 0.2
on_cup_size_window_s: 0.5
# Reviewed episodes the rule gets wrong (one row each, with the reason).
qc_decisions_file: qc_decisions_socp.csv

# Landmarks far outside the arena or contradicted by the skeleton (a nose on
# an object outside the arena, points on the reflection) are removed; nose and
# body centre are rebuilt from rigid neighbours, collapsed frames stay
# untracked. Real landmarks of a climbing mouse project up to 14 cm beyond the
# floor outline (2026-11-05, 42 recordings). See "Landmark repair" in
# docs/assay_definitions.md.
landmark_repair: true
landmark_repair_landmarks: [nose, leftEar, rightEar, spine1, leftArm, rightArm, bodycentre, leftFlank, rightFlank, spine2, tailbase]
landmark_repair_targets: [nose, bodycentre]
landmark_repair_margin_cm: 3
landmark_repair_margin_fraction: 0.6
landmark_repair_min_share: 0.5
landmark_repair_min_landmarks: 4
landmark_repair_max_anchor_error_cm: 2
landmark_repair_outside_cm: 15

min_bout_s: 0.0
max_gap_s: 0.0

write_manifest: true
