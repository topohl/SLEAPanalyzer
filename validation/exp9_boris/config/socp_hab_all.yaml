# Exp9 social preference habituation (both cups empty), all six batches.
#
# Same detector and arena as socp_all.yaml (S1, S2). There is no manual
# habituation scoring, so this phase has no method validation of its own; it
# uses the S1/S2 detector, which was validated on Batch 1.
#
# NOVEL/FAMILIAR: 08_stage_all_batches.R stages novelLocS1.txt as
# novelLocHAB.txt (the raw novelLocHAB.txt files are inconsistent between
# batches). contactNovel is therefore contact with the empty cup that holds
# the stranger mouse in S1, and its preference index is the side bias before
# any mouse is present.
#
# metadata_dir is deliberately NOT set, as in socp_all.yaml.

input_dir: C:/Users/topohl/Documents/exp9_sleap_staging/SocP
output_dir: C:/Users/topohl/iCloudDrive/Dokumente/Analysis/Behavior/correlate_sleap_boris/sleap_output_all/SocP
animal_id_code_file: C:/Users/topohl/Documents/exp9_sleap_staging/animalIDCode.txt
novel_location_file_prefix: novelLoc
phases: [HAB]
batches: [B1, B2, B3, B4, B5, B6]

fps: 30

arena_width_cm: 44
arena_height_cm: 24
arena_corner_names: [tl, tr, br, bl]

max_interpolation_gap_s: 0.2
likelihood_cutoff: ~
max_plausible_speed_cm_s: 100

qc_min_valid_fraction: 0.8
qc_max_longest_gap_s: 5.0
qc_max_interpolated_fraction: 0.2

movement_cutoff_cm_s: 5
integration_period_frames: 5

contact_distance_cm: 6
body_exclusion_distance_cm: 1
proximity_range_cm: [6, 10]
require_orientation: false

# Time on top of a cup is not contact; same rule and values as socp_all.yaml.
on_cup_exclusion: true
on_cup_footprint_radius_cm: 4
on_cup_beyond_cm: 2
on_cup_max_distance_cm: 10
on_cup_min_apparent_size: 1.08
on_cup_merge_gap_s: 0.5
on_cup_min_episode_s: 0.2
on_cup_size_window_s: 0.5
qc_decisions_file: qc_decisions_socp.csv

# Landmark repair: same settings as socp_all.yaml.
landmark_repair: true
landmark_repair_landmarks: [nose, leftEar, rightEar, spine1, leftArm, rightArm, bodycentre, leftFlank, rightFlank, spine2, tailbase]
landmark_repair_targets: [nose, bodycentre]
landmark_repair_margin_cm: 3
landmark_repair_margin_fraction: 0.6
landmark_repair_min_share: 0.5
landmark_repair_min_landmarks: 4
landmark_repair_max_anchor_error_cm: 2
landmark_repair_outside_cm: 15

# A mouse investigating a cup under its lid (the lid overhangs the cup on the
# corner side) keeps only the back of its head in view, and the pose model puts
# the nose at the lid edge, up to several cm short of the cup. The nose is put
# back at the head's median length along the ear-to-nose direction, after the
# on-cup detection. Checked against the frame-by-frame manual scoring of batch
# 1 (2026-11-05, scripts/26_frame_agreement.R); see "Hidden head" in
# docs/assay_definitions.md.
head_length_restore: true

min_bout_s: 0.0
max_gap_s: 0.0

write_manifest: true
